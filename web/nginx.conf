# Serves the built console and proxies the api path prefix to the API,
# stripping the prefix, as the Vite dev server does in development.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The page is revalidated on every load, so a rebuilt image shows at once;
    # the files it references carry a content hash in their names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The trailing slash on proxy_pass replaces the matched prefix:
    # /api/findings reaches the API as /findings. "api" is the API's service
    # name under compose and in the cluster.
    location /api/ {
        proxy_pass http://api:8080/;
    }
}
