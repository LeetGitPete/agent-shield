services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentshield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared state of the detector's exfiltration rule; no persistence.
  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  detector:
    build: { context: ., args: { SERVICE: detector } }
    environment:
      <<: &backend-env
        AMQP_URL: amqp://guest:guest@rabbitmq:5672/
        POSTGRES_URL: postgres://postgres:postgres@postgres:5432/agentshield
      REDIS_ADDR: redis:6379
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build: { context: ., args: { SERVICE: api } }
    environment:
      <<: *backend-env
      RABBITMQ_MGMT_URL: http://guest:guest@rabbitmq:15672 # read by GET /stats
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }

  triage:
    build: { context: ., args: { SERVICE: triage } }
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-} # from .env, never committed; only the gemini provider needs it
      # mock unless .env sets a non-empty value, so a key in .env alone never spends provider quota
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-mock}
      MOCK_TRIAGE_DELAY_MS: ${MOCK_TRIAGE_DELAY_MS:-} # empty: the service's own default
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # One sensor simulates the whole fleet of customers and agents. Its load
  # settings are left at the code defaults: 4 customers with 10 agents each,
  # about 10 events per second, a random load pattern.
  sensor:
    build: { context: ., args: { SERVICE: sensor } }
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq: { condition: service_healthy }
