services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentshield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  detector:
    build: { context: ., args: { SERVICE: detector } }
    environment: &backend-env
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/agentshield
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  api:
    build: { context: ., args: { SERVICE: api } }
    environment: *backend-env
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }

  triage:
    build: { context: ., args: { SERVICE: triage } }
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY} # from .env, never committed
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # Two sensors posing as different customers' agents.
  sensor-acme:
    build: { context: ., args: { SERVICE: sensor } }
    environment:
      <<: *backend-env
      CUSTOMER_ID: acme
      AGENT_ID: agent-1
    depends_on:
      rabbitmq: { condition: service_healthy }

  sensor-globex:
    build: { context: ., args: { SERVICE: sensor } }
    environment:
      <<: *backend-env
      CUSTOMER_ID: globex
      AGENT_ID: agent-7
    depends_on:
      rabbitmq: { condition: service_healthy }
