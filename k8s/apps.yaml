# AgentShield services. Images are built locally with a fixed tag. The
# cluster node keeps its own image store and pulls them through Docker
# Desktop's local registry mirror, so the pull policy is Always: with Never
# the node cannot see a locally built image, and with IfNotPresent it keeps
# running the copy it pulled first after a rebuild.
# Deploy with "dev.ps1 deploy", which builds, applies and restarts.
# Triage runs the mock provider here. The Gemini key is only needed for the
# gemini provider; it comes from the Secret "gemini", which "dev.ps1 deploy"
# creates from the local environment file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
spec:
  # No replica count: the scaled object in scaledobject.yaml sets it, between
  # 1 and 5, and applying this manifest again must not reset its decision.
  # The replicas share the exfiltration rule's state through Redis.
  selector: { matchLabels: { app: detector } }
  template:
    metadata: { labels: { app: detector } }
    spec:
      containers:
        - name: detector
          image: agent-shield-detector:local
          imagePullPolicy: Always
          env:
            - { name: AMQP_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: POSTGRES_URL, value: "postgres://postgres:postgres@postgres:5432/agentshield" }
            - { name: REDIS_ADDR, value: "redis:6379" }
            # A synthetic evaluation cost: every event takes at least this many
            # milliseconds. It stands in for heavier rule evaluation, so that one
            # replica saturates at a load small hardware can produce and
            # autoscaling can be load tested. The code default is 0.
            - { name: RULE_EVAL_DELAY_MS, value: "5" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
spec:
  replicas: 1
  selector: { matchLabels: { app: triage } }
  template:
    metadata: { labels: { app: triage } }
    spec:
      containers:
        - name: triage
          image: agent-shield-triage:local
          imagePullPolicy: Always
          env:
            - { name: AMQP_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: POSTGRES_URL, value: "postgres://postgres:postgres@postgres:5432/agentshield" }
            - { name: TRIAGE_PROVIDER, value: mock } # the LLM provider is only called once this is set to gemini
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: gemini, key: GEMINI_API_KEY, optional: true } } # triage starts without the Secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2 # stateless: scales freely
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: agent-shield-api:local
          imagePullPolicy: Always
          env:
            - { name: AMQP_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: POSTGRES_URL, value: "postgres://postgres:postgres@postgres:5432/agentshield" }
            - { name: RABBITMQ_MGMT_URL, value: "http://guest:guest@rabbitmq:15672" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer # Docker Desktop exposes this on localhost:8080
  selector: { app: api }
  ports:
    - { port: 8080 }
---
# One sensor simulates the whole fleet of customers and agents. The settings
# below are the low load level. "dev.ps1 load" changes the rate and the
# suspicious probability on the running Deployment and "dev.ps1 deploy" puts
# them back. SENSOR_SEED is left unset, so the load pattern is random; set it
# to replay a pattern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
spec:
  replicas: 1
  strategy: { type: Recreate } # a change of settings never runs two sensors at once
  selector: { matchLabels: { app: sensor } }
  template:
    metadata: { labels: { app: sensor } }
    spec:
      containers:
        - name: sensor
          image: agent-shield-sensor:local
          imagePullPolicy: Always
          env:
            - { name: AMQP_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: SENSOR_CUSTOMERS, value: "4" }
            - { name: SENSOR_AGENTS_PER_CUSTOMER, value: "10" }
            - { name: SENSOR_EVENTS_PER_SEC, value: "10" } # the average of the whole fleet
            - { name: SENSOR_SUSPICIOUS_PROB, value: "0.005" } # about 3 findings a minute at this rate
